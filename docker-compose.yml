services:
  mysql:
    image: mysql:8.4
    container_name: stay-aggregator-mysql
    environment:
      MYSQL_DATABASE: stay_aggregator
      MYSQL_ROOT_PASSWORD: local
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
